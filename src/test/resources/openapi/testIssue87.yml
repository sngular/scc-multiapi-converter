openapi: "3.0.0"
info:
  version: 1.0.0
  title: Test API for Issue 87
paths:
  /users:
    post:
      summary: Create user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
      responses:
        '200':
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
components:
  schemas:
    UserRequest:
      type: object
      required:
      - name
      - email
      properties:
        name:
          type: string
        email:
          type: string
        age:
          type: integer
    UserResponse:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: integer
        name:
          type: string
